<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
    <meta name="theme-color" content="#9b5de5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Superstars">
    <meta name="description" content="A rainbow game world for the superstar girls, made by uncle Tay Tay.">
    <title>Superstar World 🌈</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="preload" href="assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/select.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/town.css">
    <link rel="stylesheet" href="css/flight.css">
    <link rel="stylesheet" href="css/dressup.css">
    <link rel="stylesheet" href="css/house.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/stickers.css">
    <link rel="stylesheet" href="css/balloons.css">
    <link rel="stylesheet" href="css/keepy.css">
    <link rel="stylesheet" href="css/memory.css">
    <link rel="stylesheet" href="css/dance.css">
    <link rel="stylesheet" href="css/piano.css">
    <link rel="stylesheet" href="css/colouring.css">
    <link rel="stylesheet" href="css/bakery.css">
    <link rel="stylesheet" href="css/squish.css">
</head>
<body>
    <div id="app"><div id="stage"></div></div>
    <div id="overlay"></div>
    <div id="toasts"></div>
    <canvas id="fx"></canvas>
    <div id="curtain"></div>
    <div id="loading">
        <div class="loading-star">🌟</div>
        <div class="loading-title">Superstar World</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>
    <noscript><p style="position:fixed;inset:0;padding:40px;font-size:24px;text-align:center;background:#fff;">This game needs JavaScript turned on.</p></noscript>

    <!-- Engine -->
    <script defer src="js/core/util.js"></script>
    <script defer src="js/data/catalog.js"></script>
    <script defer src="js/core/store.js"></script>
    <script defer src="js/core/audio.js"></script>
    <script defer src="js/core/fx.js"></script>
    <script defer src="js/core/assets.js"></script>
    <script defer src="js/core/scene.js"></script>
    <script defer src="js/core/ui.js"></script>
    <!-- Drawing the girls and pets -->
    <script defer src="js/avatar.js"></script>
    <script defer src="js/pets.js"></script>
    <!-- Places -->
    <script defer src="js/scenes/select.js"></script>
    <script defer src="js/scenes/settings.js"></script>
    <script defer src="js/scenes/town.js"></script>
    <script defer src="js/scenes/flight.js"></script>
    <script defer src="js/scenes/dressup.js"></script>
    <script defer src="js/scenes/house.js"></script>
    <script defer src="js/scenes/shop.js"></script>
    <script defer src="js/scenes/stickers.js"></script>
    <!-- Mini-games -->
    <script defer src="js/games/balloons.js"></script>
    <script defer src="js/games/keepy.js"></script>
    <script defer src="js/games/memory.js"></script>
    <script defer src="js/games/dance.js"></script>
    <script defer src="js/games/piano.js"></script>
    <script defer src="js/games/colouring.js"></script>
    <script defer src="js/games/bakery.js"></script>
    <script defer src="js/games/squish.js"></script>
    <!-- Go! -->
    <script defer src="js/main.js"></script>
</body>
</html>
