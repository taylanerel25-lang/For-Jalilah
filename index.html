<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Rainbow Flight - For the Triplet Superstars! 🌈✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0FFFF);
            height: 100vh;
            font-family: 'Arial', sans-serif;
            /* No pinch-zoom, no text selection, no long-press menus - little fingers tap everywhere! */
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* Heads-up display: only shown while flying */
        #hud {
            position: absolute;
            top: calc(8px + env(safe-area-inset-top));
            left: 10px;
            right: 10px;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            color: #333;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            pointer-events: none;
        }
        body.playing #hud { display: flex; }
        .wallet-line {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        .wallet-pair {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .wallet-line img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
        /* Pop-up panels (menu, shop, my stuff) */
        .panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            box-sizing: border-box;
            width: 92%;
            max-width: 340px;
            overflow-y: auto;
            max-height: 92vh;
            flex-direction: column;
            gap: 12px;
        }
        .panel h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        #char-select {
            background: linear-gradient(135deg, #FFD700, #FF69B4, #87CEFA);
            border: 4px solid #FFD700;
        }
        .panel .char-btn {
            background: rgba(255,255,255,0.9);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.15s ease;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .panel .char-btn:hover, .panel .char-btn:active {
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(255,215,0,0.6);
            background: rgba(255,255,255,1);
        }
        .char-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FFD700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: var(--placeholder, #fff);
            flex-shrink: 0;
        }
        #shop, #my-stuff {
            background: linear-gradient(135deg, #FF69B4, #87CEFA, #FFD700);
            border: 4px solid #FF69B4;
        }
        #shop h2, #my-stuff h2, #my-house h2 {
            font-size: 28px;
            color: #FF1493;
        }
        .panel button, #my-house button {
            background: #FFD700;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .panel button:hover, #my-house button:hover { background: #FFA500; }
        .panel button:disabled { background: #ddd; color: #777; cursor: default; }
        .panel .close-btn, #my-house .close-btn { background: #FF69B4; }
        /* Shop and My Stuff rows */
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.85);
            border-radius: 15px;
            padding: 8px 10px;
            text-align: left;
        }
        .item-pic {
            width: 64px;
            height: 64px;
            object-fit: contain;
            flex-shrink: 0;
            font-size: 48px;
            line-height: 64px;
            text-align: center;
        }
        .item-info { flex: 1; min-width: 0; }
        .item-info h3 {
            font-size: 18px;
            margin: 0 0 4px 0;
            color: #4B0082;
        }
        .price {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .price img { width: 22px; height: 22px; object-fit: contain; }
        .item-row button { padding: 8px 12px; font-size: 16px; white-space: nowrap; }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #4B0082;
            margin: 6px 0 0 0;
        }
        .empty-note { font-size: 18px; color: #333; margin: 0; }
        /* Home button while flying */
        #back-home {
            position: absolute;
            top: calc(8px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            padding: 8px 14px;
            white-space: nowrap;
            background: linear-gradient(135deg, #FF69B4, #FFD700);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: #333;
            font-weight: bold;
            display: none;
        }
        body.playing #back-home { display: block; }
        #dedication {
            font-size: 20px;
            color: #333;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        /* My House fills the whole screen */
        #my-house {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: calc(10px + env(safe-area-inset-top)) 10px 10px 10px;
            box-sizing: border-box;
            background: #ffd6e0 url("ChatGPT Image Nov 2, 2025, 03_42_35 PM.png") no-repeat center center / cover;
            text-align: center;
        }
        #my-house h2 {
            margin: 0 0 8px 0;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
        }
        #house-note {
            font-size: 18px;
            font-weight: bold;
            color: #4B0082;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            padding: 8px 14px;
            margin: 0;
        }
        #house-items {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 45%;
        }
        .house-item {
            position: absolute;
            transform: translate(-50%, 0);
            width: var(--size, 110px);
            height: var(--size, 110px);
            object-fit: contain;
            font-size: calc(var(--size, 110px) * 0.8);
            line-height: var(--size, 110px);
            text-align: center;
            cursor: pointer;
            animation: bob 2.4s ease-in-out infinite;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.25));
        }
        .house-item.jump { animation: jump 0.5s ease-out; }
        @keyframes bob {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -8px); }
        }
        @keyframes jump {
            0% { transform: translate(-50%, 0) scale(1); }
            40% { transform: translate(-50%, -60px) scale(1.15); }
            100% { transform: translate(-50%, 0) scale(1); }
        }
        /* Friendly pop-up message instead of browser alerts */
        #toast {
            position: fixed;
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255,255,255,0.97);
            border: 4px solid #FFD700;
            border-radius: 25px;
            padding: 16px 22px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 10;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        @media (max-width: 400px), (max-height: 500px) {
            .panel h2 { font-size: 20px; }
            #shop h2, #my-stuff h2, #my-house h2 { font-size: 22px; }
            .panel .char-btn { font-size: 15px; padding: 7px; gap: 8px; }
            .char-preview { width: 48px; height: 48px; }
            .panel { padding: 14px; gap: 8px; }
            .item-pic { width: 52px; height: 52px; font-size: 40px; line-height: 52px; }
            .item-info h3 { font-size: 16px; }
            #dedication { font-size: 16px; }
            #hud { font-size: 20px; }
            .wallet-line { font-size: 18px; }
            .wallet-line img { width: 28px; height: 28px; }
        }
        @media (max-width: 520px) {
            /* Stack coins over jewels so the Home button has room in the middle */
            #hud .wallet-line { flex-direction: column; align-items: flex-end; gap: 0; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">❤️ <span id="heart-count">0</span></div>
        <div class="wallet-line">
            <span class="wallet-pair"><img class="coin-img" src="ChatGPT Image Nov 2, 2025, 01_25_25 PM.png" alt="coins"><span class="coin-count">0</span></span>
            <span class="wallet-pair"><img class="jewel-img" src="ChatGPT Image Nov 2, 2025, 01_11_08 PM.png" alt="jewels"><span class="jewel-count">0</span></span>
        </div>
    </div>
    <button id="back-home" onclick="goHome()">Back Home 🏠</button>
    <div id="char-select" class="panel">
        <div id="dedication">A game for you! made by your uncle Tay Tay <span style="font-size: 2em;">👮‍♂️</span></div>
        <div class="wallet-line" style="justify-content: center;">
            <span class="wallet-pair"><img class="coin-img" src="ChatGPT Image Nov 2, 2025, 01_25_25 PM.png" alt="coins"><span class="coin-count">0</span></span>
            <span class="wallet-pair"><img class="jewel-img" src="ChatGPT Image Nov 2, 2025, 01_11_08 PM.png" alt="jewels"><span class="jewel-count">0</span></span>
        </div>
        <h2>🌈 Choose Your Superstar! ✨</h2>
        <button class="char-btn" onclick="selectCharacter(0)">
            <img class="char-preview" src="Alayna.png" alt="Alayna" style="--placeholder: #dda0dd;">
            <span>🚀 Alayna! 💜</span>
        </button>
        <button class="char-btn" onclick="selectCharacter(1)">
            <img class="char-preview" src="Jazmine.png" alt="Jazmine" style="--placeholder: #ffc0cb;">
            <span>🌟 Jazmine! 💕</span>
        </button>
        <button class="char-btn" onclick="selectCharacter(2)">
            <img class="char-preview" src="Lilah.png" alt="Lilah" style="--placeholder: #87cefa;">
            <span>⭐ Lilah! 💙</span>
        </button>
        <button class="char-btn" onclick="selectCharacter(3)">
            <img class="char-preview" src="Louisa.png" alt="Louisa" style="--placeholder: #ffc0cb;">
            <span>🚀 Louisa! 💕</span>
        </button>
        <button class="char-btn" onclick="selectCharacter(4)">
            <img class="char-preview" src="Julia.png" alt="Julia" style="--placeholder: #dda0dd;">
            <span>🌟 Julia! 💜</span>
        </button>
        <button class="char-btn" onclick="openShop()"><span>Shop 🛍️</span></button>
        <button class="char-btn" onclick="openMyStuff()"><span>My Stuff 🎒</span></button>
        <button class="char-btn" onclick="openMyHouse()"><span>My House 🏠</span></button>
    </div>
    <div id="shop" class="panel">
        <h2>Kid-Friendly Shop! 🛍️</h2>
        <div class="wallet-line" style="justify-content: center;">
            <span class="wallet-pair"><img class="coin-img" src="ChatGPT Image Nov 2, 2025, 01_25_25 PM.png" alt="coins"><span class="coin-count">0</span></span>
            <span class="wallet-pair"><img class="jewel-img" src="ChatGPT Image Nov 2, 2025, 01_11_08 PM.png" alt="jewels"><span class="jewel-count">0</span></span>
        </div>
        <div id="shop-list"></div>
        <button class="close-btn" onclick="closeShop()">Close</button>
    </div>
    <div id="my-stuff" class="panel">
        <h2>My Stuff! 🎒</h2>
        <div id="inventory-list"></div>
        <button class="close-btn" onclick="closeMyStuff()">Close</button>
    </div>
    <div id="my-house">
        <h2>My House 🏠</h2>
        <p id="house-note"></p>
        <div id="house-items"></div>
        <button class="close-btn" onclick="closeMyHouse()" style="margin-top: 10px;">Back To Main Menu</button>
    </div>
    <div id="toast"></div>
    <!-- Audio - the flap, heart and jewel sounds are made by the game itself, so no files needed for those -->
    <audio id="bgMusic" loop preload="auto"></audio>
    <audio id="coinSound" preload="auto">
        <source src="retro-coin-3-236679.mp3" type="audio/mpeg">
    </audio>
    <script>
        // ===================== Canvas =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth;   // game width/height in CSS pixels
        let H = window.innerHeight;
        // ===================== Characters & music =====================
        const SONG_HUNTRIX = 'HUNTRIX - What It Sounds Like (Lyrics) KPop Demon Hunters.mp3';
        const SONG_TWO = 'song-jazmine-julia.mp3';
        const characters = [
            { name: 'Alayna',  file: 'Alayna.png',  color: '#dda0dd', music: SONG_HUNTRIX },
            { name: 'Jazmine', file: 'Jazmine.png', color: '#ffc0cb', music: SONG_TWO },
            { name: 'Lilah',   file: 'Lilah.png',   color: '#87cefa', music: SONG_HUNTRIX },
            { name: 'Louisa',  file: 'Louisa.png',  color: '#ffc0cb', music: SONG_HUNTRIX },
            { name: 'Julia',   file: 'Julia.png',   color: '#dda0dd', music: SONG_TWO }
        ];
        // ===================== Shop items =====================
        // slot = where the item goes when you use it (only one per slot at a time)
        const ITEMS = [
            { id: 'kitten',       name: 'Fluffy Kitten',  emoji: '😻', slot: 'pet',   price: 50, currency: 'coins',  picture: 'ChatGPT Image Nov 2, 2025, 01_40_49 PM.png' },
            { id: 'puppy',        name: 'Cute Puppy',     emoji: '🐶', slot: 'pet',   price: 50, currency: 'coins',  picture: 'ChatGPT Image Nov 2, 2025, 02_17_17 PM.png' },
            { id: 'crown',        name: 'Princess Crown', emoji: '👑', slot: 'hat',   price: 50, currency: 'coins',  picture: 'Crown.png' },
            { id: 'rainbowWings', name: 'Rainbow Wings',  emoji: '🌈', slot: 'wings', price: 3,  currency: 'jewels' },
            { id: 'sparkleTrail', name: 'Sparkle Trail',  emoji: '✨', slot: 'trail', price: 5,  currency: 'jewels' },
            { id: 'unicorn',      name: 'Unicorn Friend', emoji: '🦄', slot: 'pet',   price: 10, currency: 'jewels' }
        ];
        const SLOT_MESSAGES = {
            pet: (item) => `${item.name} is flying with you! ${item.emoji}`,
            hat: (item) => `${item.name} is on your head! ${item.emoji}`,
            wings: (item) => `You've got ${item.name}! ${item.emoji}`,
            trail: (item) => `Sparkles will follow you! ${item.emoji}`
        };
        // ===================== Core tuning (per 60ths of a second) =====================
        const gravity = 0.5;          // A bit heavier for satisfying jumps
        const jumpStrength = -15;     // Big leap for easy dodging!
        const gameSpeed = 2;          // Slower scroll for chill racing vibe
        const waterHeightRatio = 0.25;
        const waveAmplitude = 26;
        const waveFrequency = 0.015;
        const beatSpeed = 0.008;
        const charSize = 60;
        const wingSize = 25;
        const heartInterval = 150;    // Lots of hearts to catch
        const coinInterval = 200;     // Coins a bit less frequent
        const jewelInterval = coinInterval * 5; // Rare: ~1 every 5 coins
        const heartSize = 75;         // Big hearts!
        const coinSize = 40;
        const jewelSize = 40;
        const petSize = 50;
        const crownSize = 30;
        const STEP = 1000 / 60;       // The game always moves in 60ths of a second, whatever the screen's speed
        // ===================== Saved progress =====================
        function readNumber(key) {
            const n = parseInt(localStorage.getItem(key), 10);
            return isNaN(n) ? 0 : n;
        }
        function readJSON(key, fallback) {
            try {
                const v = JSON.parse(localStorage.getItem(key));
                return v === null || v === undefined ? fallback : v;
            } catch (e) {
                return fallback;
            }
        }
        let coins = readNumber('coins');
        let jewels = readNumber('jewellery');
        let inventory = readJSON('inventory', []);
        if (!Array.isArray(inventory)) inventory = [];
        let equipped = readJSON('equipped', null);
        if (!equipped || typeof equipped !== 'object') {
            // Older saves kept these separately - carry them over
            equipped = {};
            if (localStorage.getItem('equippedPet')) equipped.pet = localStorage.getItem('equippedPet');
            if (localStorage.getItem('equippedAccessory')) equipped.hat = localStorage.getItem('equippedAccessory');
        }
        function saveProgress() {
            try {
                localStorage.setItem('coins', coins);
                localStorage.setItem('jewellery', jewels);
                localStorage.setItem('inventory', JSON.stringify(inventory));
                localStorage.setItem('equipped', JSON.stringify(equipped));
            } catch (e) { /* private browsing - just keep going */ }
        }
        // ===================== Pictures =====================
        // Loads a picture and trims away the empty space around it so it fills its circle.
        // If the browser won't let us look at the pixels (happens when index.html is opened
        // straight from a folder), we just use the picture as it is.
        function loadSprite(src, onReady) {
            const sprite = { img: null, ready: false, src, _url: null };
            const raw = new Image();
            raw.onload = () => {
                let trimmed = null;
                try { trimmed = trimToContent(raw); } catch (e) { /* pixels not readable here */ }
                sprite.img = trimmed || raw;
                sprite.ready = true;
                if (onReady) onReady(sprite);
            };
            raw.onerror = () => console.warn(`Could not load "${src}" - check the file name!`);
            raw.src = src;
            return sprite;
        }
        function trimToContent(img) {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth;
            c.height = img.naturalHeight;
            const cctx = c.getContext('2d');
            cctx.drawImage(img, 0, 0);
            const data = cctx.getImageData(0, 0, c.width, c.height).data;
            let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 8) {
                    const p = (i - 3) / 4;
                    const x = p % c.width, y = (p / c.width) | 0;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < 0) return null;
            const cw = maxX - minX + 1, ch = maxY - minY + 1;
            const side = Math.max(cw, ch);
            const outSide = Math.min(side, 256); // small and sharp is all the game needs
            const scale = outSide / side;
            const out = document.createElement('canvas');
            out.width = outSide;
            out.height = outSide;
            out.getContext('2d').drawImage(c, minX, minY, cw, ch,
                (side - cw) / 2 * scale, (side - ch) / 2 * scale, cw * scale, ch * scale);
            return out;
        }
        // A URL we can put in an <img> tag (trimmed if we could trim, otherwise the file itself)
        function spriteUrl(sprite) {
            if (!sprite.ready || !(sprite.img instanceof HTMLCanvasElement)) return sprite.src;
            if (!sprite._url) sprite._url = sprite.img.toDataURL('image/png');
            return sprite._url;
        }
        // Draws a sprite centred on (cx, cy), fitting inside size x size without squashing it
        function drawSprite(sprite, cx, cy, size) {
            const img = sprite.img;
            const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            const s = size / Math.max(w, h);
            ctx.drawImage(img, cx - w * s / 2, cy - h * s / 2, w * s, h * s);
        }
        function drawEmoji(emoji, cx, cy, size) {
            ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, cx, cy + size * 0.06);
        }
        const previews = document.querySelectorAll('.char-btn img.char-preview');
        characters.forEach((char, index) => {
            char.sprite = loadSprite(char.file, (sprite) => {
                if (previews[index]) previews[index].src = spriteUrl(sprite);
            });
        });
        const coinSprite = loadSprite('ChatGPT Image Nov 2, 2025, 01_25_25 PM.png', (s) => {
            document.querySelectorAll('.coin-img').forEach(img => img.src = spriteUrl(s));
        });
        const jewelSprite = loadSprite('ChatGPT Image Nov 2, 2025, 01_11_08 PM.png', (s) => {
            document.querySelectorAll('.jewel-img').forEach(img => img.src = spriteUrl(s));
        });
        ITEMS.forEach(item => {
            if (item.picture) item.sprite = loadSprite(item.picture);
        });
        function itemById(id) {
            return ITEMS.find(item => item.id === id);
        }
        function equippedItem(slot) {
            const item = itemById(equipped[slot]);
            return item && inventory.includes(item.id) ? item : null;
        }
        // ===================== Sounds =====================
        const bgMusic = document.getElementById('bgMusic');
        const coinSound = document.getElementById('coinSound');
        bgMusic.addEventListener('error', () => console.warn(`Could not play music "${bgMusic.getAttribute('data-current-src')}" - check the file name!`));
        let audioCtx = null;
        function getAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }
        // A little musical blip: slides from freq to "to" over dur seconds
        function blip({ freq = 440, to = freq, type = 'sine', dur = 0.12, vol = 0.12, delay = 0 }) {
            const ac = getAudio();
            if (!ac) return;
            const t = ac.currentTime + delay;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;

                ctx.arc(cx, cy, 40, 0, Math.PI * 2);

            gradient.addColorStop(0.28, 'rgba(255, 215, 0, 0.82)');
            gradient.addColorStop(0.42, 'rgba(0, 200, 0, 0.78)');

            ctx.beginPath();
            ctx.moveTo(0, getWaterHeightAtX(0));
            for (let x = 0; x <= W; x += 5) {
                ctx.lineTo(x, getWaterHeightAtX(x));

            ctx.moveTo(x, y + size / 4);

            ctx.quadraticCurveTo(x - size / 2, y + size / 2, x - size / 2, y + size / 4);

        // ===================== Game logic =====================

        }
        function equipItem(id) {
            const item = itemById(id);
            if (!item || !inventory.includes(id)) return;
            equipped[item.slot] = id;
            saveProgress();
            sfx.tada();
            toast(SLOT_MESSAGES[item.slot](item));
            renderMyStuff();
        }
        function unequipItem(id) {
            const item = itemById(id);
            if (!item) return;
            if (equipped[item.slot] === id) delete equipped[item.slot];
            saveProgress();
            toast(`${item.name} is back in your bag! 🎒`);
            renderMyStuff();
        }
        // ---- My House ----
        function renderHouse() {
            const box = document.getElementById('house-items');
            const note = document.getElementById('house-note');
            box.innerHTML = '';
            const owned = ITEMS.filter(item => inventory.includes(item.id));
            if (owned.length === 0) {
                note.textContent = 'Your house is empty! Visit the shop to fill it up 🛍️';
                return;
            }
            note.textContent = 'Tap your pets and treasures! 🐾';
            const size = Math.round(Math.max(64, Math.min(120, (window.innerWidth / (owned.length + 1)) * 1.1)));
            owned.forEach((item, i) => {
                let el;
                if (item.sprite) {
                    el = document.createElement('img');
                    el.src = spriteUrl(item.sprite);
                    el.alt = item.name;
                } else {
                    el = document.createElement('div');
                    el.textContent = item.emoji;
                }
                el.className = 'house-item';
                el.style.setProperty('--size', `${size}px`);
                el.style.left = `${((i + 1) / (owned.length + 1)) * 100}%`;
                el.style.bottom = `${18 + (i % 2) * 14}%`;
                el.style.animationDelay = `${i * 0.4}s`;
                el.addEventListener('pointerdown', () => {
                    el.classList.remove('jump');
                    void el.offsetWidth; // restart the animation
                    el.classList.add('jump');
                    sfx.boing();
                    toast(`${item.name} says hi! ${item.emoji}`, 1200);
                });
                el.addEventListener('animationend', (e) => {
                    if (e.animationName === 'jump') el.classList.remove('jump');
                });
                box.appendChild(el);
            });
        }
        function openMyHouse() {
            renderHouse();
            showScreen('my-house');
        }
        function closeMyHouse() {
            showScreen('char-select');
        }
        // ===================== Screen size =====================
        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2); // sharp on phone screens
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            waterHeight = H * waterHeightRatio;
            if (playing) {
                player.x = W / 2;
                player.y = Math.min(player.y, getWaterHeightAtX(player.x) - charSize / 2);
                render();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        // ===================== Start =====================
        resizeCanvas();
        updateWallet();
        showScreen('char-select');
    </script>
</body>
</html>
