<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Flight - For the Triplet Superstars! 🌈✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0FFFF);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            border: 1px solid #000;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: red;
            display: none;
            text-align: center;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #restart-btn {
            font-size: 24px;
            padding: 10px 20px;
            background: #FFD700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        #restart-btn:hover { background: #FFA500; }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            color: #333;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            user-select: none;
        }
    </style>
</head>
<body>
<div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="game-over">
        Oh no! Splash! 💦<br>
        Final Score: <span id="final-score">0</span><br>
        <button id="restart-btn" onclick="restartGame()">Play Again! 🚀</button>
    </div>

    <!-- Audio elements - Add your fun files here! -->
    <audio id="bgMusic" loop>
        <source src="background-music.mp3" type="audio/mpeg"> <!-- Upbeat triplet tune? 🎶 -->
    </audio>
    <audio id="flapSound">
        <source src="flap-sound.mp3" type="audio/mpeg"> <!-- Wing flap whoosh! -->
    </audio>
    <audio id="portalSound">
        <source src="portal-sound.mp3" type="audio/mpeg"> <!-- Magical dive! ✨ -->
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Audio hooks
        const bgMusic = document.getElementById('bgMusic');
        const flapSound = document.getElementById('flapSound');
        const portalSound = document.getElementById('portalSound');

        // Core tuning
        const gravity = 0.38;
        const flapStrength = -9.5;
        const gameSpeed = 2.6;
        const underwaterDuration = 240; // ~4 seconds
        const waterHeightRatio = 0.25;
        const waveAmplitude = 26;
        const waveFrequency = 0.015;
        const beatSpeed = 0.08;

        // Runtime state
        let waterHeight = canvas.height * waterHeightRatio;
        let waveOffset = 0;
        let beatPhase = 0;
        let score = 0;
        let gameOver = false;
        let isUnderwater = false;
        let underwaterTimer = 0;
        let graceTimer = 0;
        let animationId = null;

        const characters = [
            { name: 'Alayna', x: canvas.width / 4, y: canvas.height / 2 - 60, vy: 0, image: new Image(), ready: false, placeholder: '#ffc0cb' },
            { name: 'Jazmine', x: canvas.width / 2, y: canvas.height / 2 - 40, vy: 0, image: new Image(), ready: false, placeholder: '#dda0dd' },
            { name: 'Lilah', x: (3 * canvas.width) / 4, y: canvas.height / 2 - 50, vy: 0, image: new Image(), ready: false, placeholder: '#87cefa' }
        ];

        characters[0].image.src = 'Alayna.jpg';
        characters[1].image.src = 'Jazmine.png';
        characters[2].image.src = 'Lilah.jpg';

        const charSize = 60;
        const wingSize = 25;

        let flappingPressed = false;
        let flappingPressedPrev = false;

        const portal = { x: canvas.width + 200, y: 0, size: 120, active: false };
        let portalSpawnTimer = 0;
        const portalInterval = 180;

        let diveOrigins = characters.map((char) => char.y);

        window.addEventListener('mousedown', () => (flappingPressed = true));
        window.addEventListener('mouseup', () => (flappingPressed = false));
        window.addEventListener('touchstart', (event) => {
            event.preventDefault();
            flappingPressed = true;
        });
        window.addEventListener('touchend', () => (flappingPressed = false));

        const resumeAudio = () => {
            bgMusic.play().catch(() => {});
            window.removeEventListener('mousedown', resumeAudio);
            window.removeEventListener('touchstart', resumeAudio);
        };
        window.addEventListener('mousedown', resumeAudio, { once: true });
        window.addEventListener('touchstart', resumeAudio, { once: true });

        function drawWings(x, y, flapAngle) {
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - charSize / 2, y);
            ctx.quadraticCurveTo(x - charSize / 2 - wingSize * 1.2, y + flapAngle * 1.5, x - charSize / 2 - wingSize / 2, y + flapAngle);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + charSize / 2, y);
            ctx.quadraticCurveTo(x + charSize / 2 + wingSize * 1.2, y + flapAngle * 1.5, x + charSize / 2 + wingSize / 2, y + flapAngle);
            ctx.stroke();
        }

        function getWaterHeightAtX(x) {
            return canvas.height - waterHeight + Math.sin((x * waveFrequency + waveOffset) * 2) * waveAmplitude;
        }

        function drawRainbowWater() {
            beatPhase += beatSpeed;
            waveOffset += gameSpeed * 0.32 + Math.sin(beatPhase) * 0.25;

            const gradient = ctx.createLinearGradient(0, canvas.height - waterHeight * 1.5, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 0, 0, 0.82)');
            gradient.addColorStop(0.14, 'rgba(255, 140, 0, 0.8)');
            gradient.addColorStop(0.28, 'rgba(255, 215, 0, 0.82)');
            gradient.addColorStop(0.42, 'rgba(0, 200, 0, 0.78)');
            gradient.addColorStop(0.56, 'rgba(30, 144, 255, 0.8)');
            gradient.addColorStop(0.7, 'rgba(106, 90, 205, 0.82)');
            gradient.addColorStop(1, 'rgba(186, 85, 211, 0.9)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, getWaterHeightAtX(0));
            for (let x = 0; x <= canvas.width; x += 5) {
                ctx.lineTo(x, getWaterHeightAtX(x));
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            for (let i = 0; i < 20; i++) {
                const wx = (i * 110 + waveOffset * 12) % canvas.width;
                ctx.beginPath();
                ctx.arc(wx, getWaterHeightAtX(wx) - 12, 3.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawUnderwaterWorld() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(148, 0, 211, 0.65)');
            gradient.addColorStop(0.15, 'rgba(75, 0, 130, 0.65)');
            gradient.addColorStop(0.3, 'rgba(0, 120, 255, 0.7)');
            gradient.addColorStop(0.45, 'rgba(0, 255, 180, 0.75)');
            gradient.addColorStop(0.6, 'rgba(255, 255, 0, 0.8)');
            gradient.addColorStop(0.75, 'rgba(255, 165, 0, 0.82)');
            gradient.addColorStop(0.9, 'rgba(255, 69, 0, 0.85)');
            gradient.addColorStop(1, 'rgba(120, 0, 60, 0.9)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 30; i++) {
                const bx = (i * 150 + score * 0.6) % canvas.width;
                const by = canvas.height - ((i * 60 + underwaterTimer * 3) % canvas.height);
                ctx.beginPath();
                ctx.arc(bx, by, Math.random() * 6 + 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#FFD700';
            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, canvas.height * 0.8 + Math.random() * 120, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPortal() {
            if (!portal.active) return;
            const glow = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
            ctx.shadowColor = 'gold';
            ctx.shadowBlur = 30 * glow;
            ctx.beginPath();
            ctx.arc(portal.x, portal.y, portal.size / 2, 0, Math.PI * 2);
            const portalGrad = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, portal.size / 2);
            portalGrad.addColorStop(0, `rgba(255, 255, 200, ${0.9 * glow})`);
            portalGrad.addColorStop(0.65, `rgba(255, 215, 0, ${0.45 * glow})`);
            portalGrad.addColorStop(1, 'rgba(255, 120, 0, 0)');
            ctx.fillStyle = portalGrad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.font = 'bold 16px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.fillText('Dive!', portal.x, portal.y + 6);
        }

        function updatePortal() {
            portalSpawnTimer++;
            if (!portal.active && !isUnderwater && portalSpawnTimer > portalInterval) {
                portal.x = canvas.width + 160;
                const verticalRange = Math.max(canvas.height - waterHeight - 260, 120);
                portal.y = 150 + Math.random() * verticalRange;
                portal.active = true;
                portalSpawnTimer = 0;
            }

            if (portal.active) {
                portal.x -= gameSpeed;
                if (portal.x + portal.size / 2 < 0) {
                    portal.active = false;
                }
            }
        }

        function checkPortalCollision() {
            if (!portal.active) return;
            for (const char of characters) {
                const dx = char.x - portal.x;
                const dy = char.y - portal.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < (charSize / 2 + portal.size / 2) * 0.9) {
                    enterUnderwater();
                    break;
                }
            }
        }

        function enterUnderwater() {
            isUnderwater = true;
            underwaterTimer = underwaterDuration;
            graceTimer = 0;
            diveOrigins = characters.map((char) => char.y);
            portal.active = false;
            portalSound.currentTime = 0;
            portalSound.play().catch(() => {});
        }

        function exitUnderwater() {
            isUnderwater = false;
            graceTimer = 30;
            characters.forEach((char) => {
                const safeY = getWaterHeightAtX(char.x) - charSize / 2 - 12;
                if (char.y > safeY) {
                    char.y = safeY;
                }
            });
        }

        function updateCharacters() {
            if (isUnderwater) {
                const progress = 1 - underwaterTimer / underwaterDuration;
                const diveDepth = canvas.height - waterHeight - charSize - 30;
                characters.forEach((char, index) => {
                    const startY = diveOrigins[index] ?? char.y;
                    const maxOffset = Math.min(diveDepth - startY, canvas.height * 0.4);
                    const wave = Math.sin(progress * Math.PI);
                    char.y = startY + wave * maxOffset;
                    char.vy = 0;
                });
                flappingPressedPrev = flappingPressed;
                return;
            }

            characters.forEach((char) => {
                if (flappingPressed) {
                    if (!flappingPressedPrev) {
                        flapSound.currentTime = 0;
                        flapSound.play().catch(() => {});
                    }
                    char.vy = flapStrength;
                } else {
                    char.vy += gravity;
                }

                char.y += char.vy;

                const ceiling = charSize / 2 + 20;
                if (char.y < ceiling) {
                    char.y = ceiling;
                    if (char.vy < 0) char.vy = 0;
                }

                const airLower = canvas.height - waterHeight - charSize - 20;
                if (char.y > airLower) {
                    char.y = airLower;
                    if (char.vy > 0) char.vy = 0;
                }

                if (graceTimer <= 0 && char.y + charSize / 2 > getWaterHeightAtX(char.x)) {
                    triggerGameOver();
                }
            });

            flappingPressedPrev = flappingPressed;
        }

        function drawCharacters() {
            const time = Date.now() * 0.01;
            const flapBase = flappingPressed ? Math.sin(time * 16) * -14 : Math.sin(time * 8) * 8;
            const underwaterRipple = isUnderwater ? Math.sin(time * 12) * 6 : 0;

            characters.forEach((char, index) => {
                const personalFlap = flapBase + underwaterRipple + Math.sin(time * 5 + index) * 3;
                drawWings(char.x, char.y, personalFlap);

                ctx.save();
                ctx.beginPath();
                ctx.arc(char.x, char.y, charSize / 2, 0, Math.PI * 2);
                if (!char.ready) {
                    ctx.fillStyle = char.placeholder;
                    ctx.fill();
                }
                ctx.clip();
                ctx.shadowColor = flappingPressed || isUnderwater ? '#FFD700' : '#FFF';
                ctx.shadowBlur = 16;
                if (char.ready && char.image.naturalWidth) {
                    ctx.drawImage(char.image, char.x - charSize / 2, char.y - charSize / 2, charSize, charSize);
                }
                ctx.restore();
            });
        }

        function drawScore() {
            document.getElementById('score').textContent = `Score: ${Math.floor(score / 60)}`;
        }

        function triggerGameOver() {
            if (gameOver) return;
            gameOver = true;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('final-score').textContent = Math.floor(score / 60);
            document.getElementById('game-over').style.display = 'block';
            bgMusic.pause();
        }

        function gameLoop() {
            if (gameOver) return;

            score++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isUnderwater) {
                drawUnderwaterWorld();
                underwaterTimer--;
                if (underwaterTimer <= 0) {
                    exitUnderwater();
                }
            } else {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGrad.addColorStop(0, '#87CEEB');
                skyGrad.addColorStop(0.5, '#B0E0E6');
                skyGrad.addColorStop(1, '#E0FFFF');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 5; i++) {
                    const cx = (i * 320 + score * 0.35) % (canvas.width + 220) - 110;
                    const cy = 90 + i * 80;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 40, 0, Math.PI * 2);
                    ctx.arc(cx + 35, cy, 50, 0, Math.PI * 2);
                    ctx.arc(cx + 70, cy, 35, 0, Math.PI * 2);
                    ctx.fill();
                }

                drawRainbowWater();
            }

            updatePortal();
            drawPortal();
            checkPortalCollision();
            updateCharacters();
            drawCharacters();
            drawScore();

            if (graceTimer > 0) {
                graceTimer--;
            }

            if (!gameOver) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function resetCharacters() {
            characters[0].x = canvas.width / 4;
            characters[1].x = canvas.width / 2;
            characters[2].x = (3 * canvas.width) / 4;

            characters[0].y = canvas.height / 2 - 60;
            characters[1].y = canvas.height / 2 - 40;
            characters[2].y = canvas.height / 2 - 50;

            characters.forEach((char) => {
                char.vy = 0;
            });

            diveOrigins = characters.map((char) => char.y);
        }

        function initGame() {
            resetCharacters();
            gameOver = false;
            isUnderwater = false;
            underwaterTimer = 0;
            graceTimer = 0;
            score = 0;
            portalSpawnTimer = 0;
            portal.active = false;
            portal.x = canvas.width + 200;
            flappingPressed = false;
            flappingPressedPrev = false;
            document.getElementById('game-over').style.display = 'none';
            bgMusic.play().catch(() => {});
            drawScore();
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            initGame();
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            waterHeight = canvas.height * waterHeightRatio;
            resetCharacters();
        });

        characters.forEach((char) => {
            char.image.addEventListener('load', () => {
                char.ready = true;
            });
            char.image.addEventListener('error', () => {
                console.warn(`Check ${char.name}'s image file.`);
            });
            if (char.image.complete && char.image.naturalWidth) {
                char.ready = true;
            }
        });

        initGame();
    </script>
</body>
</html>
