<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Flight - For the Triplet Superstars! 🌈✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0FFFF); /* Dreamy sky background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            border: 1px solid #000; /* Optional border for visibility */
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: red;
            display: none;
            text-align: center;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #restart-btn {
            font-size: 24px;
            padding: 10px 20px;
            background: #FFD700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        #restart-btn:hover {
            background: #FFA500;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            color: #333;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="game-over">
        Oh no! Splash! 💦<br>
        Final Score: <span id="final-score">0</span><br>
        <button id="restart-btn" onclick="restartGame()">Play Again! 🚀</button>
    </div>

    <!-- Audio elements - Add your fun files here! -->
    <audio id="bgMusic" loop>
        <source src="background-music.mp3" type="audio/mpeg"> <!-- Upbeat triplet tune? 🎶 -->
    </audio>
    <audio id="flapSound">
        <source src="flap-sound.mp3" type="audio/mpeg"> <!-- Wing flap whoosh! -->
    </audio>
    <audio id="portalSound">
        <source src="portal-sound.mp3" type="audio/mpeg"> <!-- Magical dive! ✨ -->
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Audio
        const bgMusic = document.getElementById('bgMusic');
        const flapSound = document.getElementById('flapSound');
        const portalSound = document.getElementById('portalSound');

        // Game variables
        let gravity = 0.4; // Gentler for little ones!
        let flapStrength = -9;
        let gameSpeed = 2.5;
        let score = 0;
        let gameOver = false;
        let isUnderwater = false;
        let underwaterTimer = 0;
        const underwaterDuration = 240; // ~4 seconds of underwater magic

        // Rainbow water - beats to the music!
        const waterHeight = canvas.height * 0.25;
        let waveOffset = 0;
        const waveAmplitude = 25;
        const waveFrequency = 0.015;
        let beatPhase = 0;
        const beatSpeed = 0.08; // Tune to your BPM (120ish?)

        // Our triplet heroes: Alayna, Jazmine, Lilah! 💖
        const characters = [
            { name: 'Alayna', x: canvas.width / 4, y: canvas.height / 2 - 50, vy: 0, image: new Image() },
            { name: 'Jazmine', x: canvas.width / 2, y: canvas.height / 2 - 30, vy: 0, image: new Image() },
            { name: 'Lilah', x: 3 * canvas.width / 4, y: canvas.height / 2 - 40, vy: 0, image: new Image() }
        ];

        // Load their beautiful faces from your repo!
        characters[0].image.src = 'Alayna.jpg';
        characters[1].image.src = 'Jazmine.png';
        characters[2].image.src = 'Lilah.jpg';

        const charSize = 60; // A bit bigger for those cute smiles!
        const wingSize = 25;

        // Glowing portal for underwater adventures
        let portal = { x: canvas.width + 200, y: 0, size: 120, active: false };
        let portalSpawnTimer = 0;
        const portalInterval = 180; // Spawn every ~3 seconds

        // Input: Tap/click to flap!
        let flappingPressed = false;
        window.addEventListener('mousedown', () => flappingPressed = true);
        window.addEventListener('mouseup', () => flappingPressed = false);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); flappingPressed = true; });
        window.addEventListener('touchend', () => flappingPressed = false);

        // Start the party!
        bgMusic.play().catch(() => {}); // Autoplay friendly

        function drawWings(x, y, flapAngle) {
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            // Left wing
            ctx.beginPath();
            ctx.moveTo(x - charSize / 2, y);
            ctx.quadraticCurveTo(x - charSize / 2 - wingSize * 1.2, y + flapAngle * 1.5, x - charSize / 2 - wingSize / 2, y + flapAngle);
            ctx.stroke();
            // Right wing
            ctx.beginPath();
            ctx.moveTo(x + charSize / 2, y);
            ctx.quadraticCurveTo(x + charSize / 2 + wingSize * 1.2, y + flapAngle * 1.5, x + charSize / 2 + wingSize / 2, y + flapAngle);
            ctx.stroke();
        }

        function getWaterHeightAtX(x) {
            return canvas.height - waterHeight + Math.sin((x * waveFrequency + waveOffset) * 2) * waveAmplitude;
        }

        function drawRainbowWater() {
            beatPhase += beatSpeed;
            waveOffset += gameSpeed * 0.5 + Math.sin(beatPhase) * 0.5; // Beat-synced waves!

            const gradient = ctx.createLinearGradient(0, canvas.height - waterHeight * 1.5, 0, canvas.height);
            gradient.addColorStop(0,    'rgba(255, 0, 0, 0.8)');
            gradient.addColorStop(0.14, 'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(0.28, 'rgba(255, 255, 0, 0.8)');
            gradient.addColorStop(0.42, 'rgba(0, 255, 0, 0.8)');
            gradient.addColorStop(0.56, 'rgba(0, 100, 255, 0.8)');
            gradient.addColorStop(0.7,  'rgba(75, 0, 130, 0.8)');
            gradient.addColorStop(1,    'rgba(148, 0, 211, 0.9)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, getWaterHeightAtX(0));

            for (let x = 0; x <= canvas.width; x += 5) {
                ctx.lineTo(x, getWaterHeightAtX(x));
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Sparkly reflections
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 20; i++) {
                const wx = (i * 100 + waveOffset * 10) % canvas.width;
                ctx.beginPath();
                ctx.arc(wx, getWaterHeightAtX(wx) - 10, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawUnderwaterWorld() {
            // Inverted rainbow ocean magic!
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0,    'rgba(148, 0, 211, 0.6)');
            gradient.addColorStop(0.14, 'rgba(75, 0, 130, 0.6)');
            gradient.addColorStop(0.28, 'rgba(0, 100, 255, 0.7)');
            gradient.addColorStop(0.42, 'rgba(0, 255, 0, 0.7)');
            gradient.addColorStop(0.56, 'rgba(255, 255, 0, 0.8)');
            gradient.addColorStop(0.7,  'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(0.84, 'rgba(255, 0, 0, 0.9)');
            gradient.addColorStop(1,    'rgba(100, 0, 50, 0.9)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bubbly fun!
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 30; i++) {
                const bx = (i * 150 + score * 0.5) % canvas.width;
                const by = canvas.height - (i * 50 + underwaterTimer * 2) % canvas.height;
                ctx.beginPath();
                ctx.arc(bx, by, Math.random() * 8 + 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Coral sparkles
            ctx.fillStyle = '#FFD700';
            for (let i = 0; i < 15; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, canvas.height * 0.8 + Math.random() * 100, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPortal() {
            if (portal.active) {
                const glow = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
                ctx.shadowColor = 'gold';
                ctx.shadowBlur = 30 * glow;
                ctx.beginPath();
                ctx.arc(portal.x, portal.y, portal.size / 2, 0, Math.PI * 2);
                const portalGrad = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, portal.size / 2);
                portalGrad.addColorStop(0, `rgba(255, 255, 200, ${0.9 * glow})`);
                portalGrad.addColorStop(0.7, `rgba(255, 215, 0, ${0.4 * glow})`);
                portalGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = portalGrad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.fillText('Dive!', portal.x, portal.y + 5);
            }
        }

        function updatePortal() {
            portalSpawnTimer++;
            if (!portal.active && portalSpawnTimer > portalInterval) {
                portal.x = canvas.width + 150;
                portal.y = 150 + Math.random() * (canvas.height - waterHeight - 250);
                portal.active = true;
                portalSpawnTimer = 0;
            }
            if (portal.active) {
                portal.x -= gameSpeed;
                if (portal.x + portal.size / 2 < 0) {
                    portal.active = false;
                }
            }
        }

        function checkPortalCollision() {
            for (let char of characters) {
                const dx = char.x - portal.x;
                const dy = char.y - portal.y;
                if (Math.sqrt(dx*dx + dy*dy) < (charSize / 2 + portal.size / 2) * 0.9 && portal.active) {
                    isUnderwater = true;
                    underwaterTimer = underwaterDuration;
                    portal.active = false;
                    portalSound.play();
                    return true;
                }
            }
            return false;
        }

        function updateCharacters() {
            for (let char of characters) {
                if (flappingPressed) {
                    char.vy = flapStrength;
                    if (!flappingPressedPrev) flapSound.play(); // Sound only on press
                } else {
                    char.vy += gravity;
                }
                char.y += char.vy;
                char.y = Math.max(charSize / 2 + 20, Math.min(canvas.height - waterHeight - charSize - 20, char.y)); // Soft bounds

                // Wavy water collision (only above water)
                if (!isUnderwater && char.y + charSize / 2 > getWaterHeightAtX(char.x)) {
                    gameOver = true;
                }
            }
            flappingPressedPrev = flappingPressed;
        }

        let flappingPressedPrev = false;

        function drawCharacters() {
            const time = Date.now() * 0.01;
            const flapAngle = flappingPressed ? Math.sin(time * 15) * -12 : Math.sin(time * 8) * 8;
            characters.forEach((char, i) => {
                // Wings flap with personality!
                const personalFlap = flapAngle + Math.sin(time * 5 + i) * 3;
                drawWings(char.x, char.y, personalFlap);

                // Glowy face clip
                ctx.save();
                ctx.beginPath();
                ctx.arc(char.x, char.y, charSize / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.shadowColor = flappingPressed ? '#FFD700' : '#FFF';
                ctx.shadowBlur = 15;
                ctx.drawImage(char.image, char.x - charSize / 2, char.y - charSize / 2, charSize, charSize);
                ctx.restore();
            });
        }

        function drawScore() {
            document.getElementById('score').textContent = `Score: ${Math.floor(score / 60)}`;
        }

        let gameStartTime = Date.now();

        function gameLoop() {
            if (gameOver) {
                document.getElementById('final-score').textContent = Math.floor(score / 60);
                document.getElementById('game-over').style.display = 'block';
                bgMusic.pause();
                return;
            }

            score++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isUnderwater) {
                drawUnderwaterWorld();
                underwaterTimer--;
                if (underwaterTimer <= 0) isUnderwater = false;
            } else {
                // Sky gradient refresh
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGrad.addColorStop(0, '#87CEEB');
                skyGrad.addColorStop(0.5, '#B0E0E6');
                skyGrad.addColorStop(1, '#E0FFFF');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

                // Fluffy clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 5; i++) {
                    const cx = (i * 300 + score * 0.3) % (canvas.width + 200) - 100;
                    ctx.beginPath();
                    ctx.arc(cx, 100 + i * 80, 40, 0, Math.PI * 2);
                    ctx.arc(cx + 30, 100 + i * 80, 50, 0, Math.PI * 2);
                    ctx.arc(cx + 60, 100 + i * 80, 35, 0, Math.PI * 2);
                    ctx.fill();
                }

                drawRainbowWater();
            }

            updatePortal();
            drawPortal();
            checkPortalCollision();
            updateCharacters();
            drawCharacters();
            drawScore();

            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            gameOver = false;
            isUnderwater = false;
            score = 0;
            portalSpawnTimer = 0;
            document.getElementById('game-over').style.display = 'none';
            bgMusic.play().catch(() => {});
            gameStartTime = Date.now();
            gameLoop();
        }

        function restartGame() {
            // Reset characters
            characters[0].y = canvas.height / 2 - 50;
            characters[1].y = canvas.height / 2 - 30;
            characters[2].y = canvas.height / 2 - 40;
            characters.forEach(c => c.vy = 0);
            initGame();
        }

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            characters[0].x = canvas.width / 4;
            characters[1].x = canvas.width / 2;
            characters[2].x = 3 * canvas.width / 4;
        });

        // Wait for images, then launch!
        let imagesLoaded = 0;
        characters.forEach(char => {
            char.image.onload = () => {
                imagesLoaded++;
                if (imagesLoaded === 3) initGame();
            };
            char.image.onerror = () => console.log(`Oops! Check ${char.name}'s image file.`);
        });
    </script>
</body>
</html>
